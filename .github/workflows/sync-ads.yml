name: Sync Ads (Every 6 Hours)

on:
  schedule:
    # 6시간마다 실행 (UTC 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ads sync
        env:
          SOURCE_API_URL: ${{ vars.SOURCE_API_URL || 'https://marblerouletteshop.com/api/ads/active' }}
          STORAGE_DIR: ./creative
          OUTPUT_API_FILE: ./api/ads/active
          IMAGE_PUBLIC_PREFIX: /creative
        run: npm run sync

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/ads/active creative/
          if git diff --staged --quiet; then
            echo "No changes in ads or creatives. Skipping commit."
          else
            git commit -m "Auto sync ads & creatives [skip ci]"
            git push
          fi
